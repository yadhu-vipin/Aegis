[package]
name = "aegis-host"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "aegis-host"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.45.1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
reqwest = { version = "0.11", features = ["stream", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures-util = "0.3"
anyhow = "1.0"
async-trait = "0.1"
uuid = { version = "1.11", features = ["v4"] }
base64 = "0.22"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(windows)'.dependencies]
# Win32_System_HostComputeSystem was removed with the HCS sandbox backend: HCS
# needs the vmcompute service, which does not exist on Windows Home.
windows = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    # Authenticode: WinVerifyTrust, plus the crypt32 calls that read the
    # signer's name out of the embedded PKCS#7 message.
    "Win32_Security_WinTrust",
    "Win32_Security_Cryptography",
    # Catalog signing: most Windows system binaries carry no embedded
    # signature, so an embedded-only check calls notepad.exe unsigned.
    "Win32_Security_Cryptography_Catalog",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
