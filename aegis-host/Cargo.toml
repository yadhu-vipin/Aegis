[package]
name = "aegis-host"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "aegis-host"
path = "src/main.rs"

# Dependencies are kept deliberately few.
#
# Every crate here runs in a process that parses hostile input and can move
# files into the user's Downloads folder, so the dependency tree is part of the
# attack surface rather than an implementation detail. `reqwest` was removed
# with the URL-scoring call it existed for: it accounted for more than half the
# tree (187 crates -> 92), brought a TLS stack this program has no use for, and
# carried the only advisory `cargo audit` reported. The host now has no
# outbound network capability at all.
[dependencies]
tokio = { version = "1.45.1", features = ["rt-multi-thread", "macros", "fs", "io-util", "time"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
uuid = { version = "1.11", features = ["v4"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(windows)'.dependencies]
# Authenticode verification is the only thing the Windows API is used for now.
# The HCS sandbox backend and its Win32_System_HostComputeSystem feature were
# removed (no vmcompute service on Windows Home), and the restricted-process
# sandbox that replaced it was dropped in turn — see DECISIONS.md.
windows = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    # Authenticode: WinVerifyTrust, plus the crypt32 calls that read the
    # signer's name out of the embedded PKCS#7 message.
    "Win32_Security_WinTrust",
    "Win32_Security_Cryptography",
    # Catalog signing: most Windows system binaries carry no embedded
    # signature, so an embedded-only check calls notepad.exe unsigned.
    "Win32_Security_Cryptography_Catalog",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
