# Aegis Host Configuration
# Central config file — all tunables live here, never in compiled code.

[host]
# Log level: error | warn | info | debug | trace
log_level = "info"

[ml]
# URL of the local ML inference service
service_url = "http://127.0.0.1:8787/score"
# Timeout in milliseconds for ML service calls
timeout_ms = 500

[risk]
# Score >= sandbox_threshold -> send to HCS detonation
sandbox_threshold = 0.4
# Score >= block_threshold -> block outright, skip sandbox, notify user
block_threshold = 0.85

[chunking]
# Chunk size in bytes (256 KB default)
chunk_size = 262144
# How many chunks to keep in ring buffer for cross-chunk intent scanning
ring_buffer_chunks = 4
# Hard ceiling on a single download, in bytes (8 GB default).
# Enforced continuously as chunks arrive, not just up front: without this a
# download with no Content-Length can write past whatever the disk-space guard
# reserved and fill the quarantine volume.
max_download_bytes = 8589934592

# Largest file the whole-file pass (structure, entropy, PE) will load into
# memory, in bytes (64 MB default).
#
# Those analyses genuinely need the complete file - you cannot find the bytes
# after a PNG's IEND chunk without them - so they are the one place memory is
# not flat. Larger files are still fully scanned by the streaming pass; they
# just skip the whole-file checks, and the verdict says so rather than
# implying a clean result.
max_whole_file_scan_bytes = 67108864
# Per-chunk read timeout in seconds
per_chunk_timeout_secs = 30
# Total transfer timeout in seconds (1 hour)
total_transfer_timeout_secs = 3600

# There is no [sandbox] section. Aegis never executes a downloaded file, so
# there is no detonation timeout to configure and no size limit past which
# detonation is skipped. This is a design decision, not a missing feature -
# see DECISIONS.md ("Detonation dropped") for the reasoning.

[quarantine]
# Quarantine subdirectory name.
#
# NOT under the system temp dir: this is a subdirectory of the user's Downloads
# folder, because Chrome's onDeterminingFilename only accepts paths relative to
# the default download directory. Absolute paths and ".." are rejected by the
# browser. Aegis creates it, locks it down to the current user, and sweeps
# abandoned files from it on start-up.
subdir = "aegis_quarantine"
# Whether to keep flagged samples on disk after verdict (false = delete)
keep_flagged_samples = false
