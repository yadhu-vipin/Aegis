<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Aegis Protection</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <div class="title">
      <span class="shield-icon">🛡️</span>
      <span class="title-text">Aegis Guard</span>
    </div>
    <div class="status-badge" id="protection-status">Active</div>
  </div>

  <!-- Surfaces a broken host installation directly, instead of letting it
       masquerade as "Aegis thinks all your files are malware". -->
  <div class="health-banner" id="health-banner" hidden>
    <div class="health-title" id="health-title"></div>
    <div class="health-detail" id="health-detail"></div>
    <button class="health-retry" id="health-retry" type="button">Re-check</button>
  </div>

  <div class="section">
    <div class="section-title">Protection Controls</div>
    <div class="toggle-row">
      <span>Layer 1: URL Hover Check</span>
      <label class="switch">
        <input type="checkbox" id="toggle-layer1" checked>
        <span class="slider"></span>
      </label>
    </div>
    <div class="toggle-row">
      <span>Layer 2: Download Sandboxing</span>
      <label class="switch">
        <input type="checkbox" id="toggle-layer2" checked>
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <div class="section">
    <div class="section-header">
      <div class="section-title">Download Activity</div>
      <button class="link-btn" id="clear-history" type="button">Clear</button>
    </div>
    <div class="blocked-count" id="blocked-count">Nothing blocked yet</div>
    <div class="verdict-list" id="verdict-list">
      <div class="empty-state">No downloads scanned yet.</div>
    </div>
  </div>

  <div class="footer">
    <span>Aegis v1.0.0 | Endpoint Download Safety</span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
